[build]
  publish = "dist"
  command = "npm run build"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[redirects]]
  from = "/cookie-policy"
  to = "/legal/cookie"
  status = 301
  force = true
[[redirects]]
  from = "/privacy-policy"
  to = "/legal/privacy"
  status = 301
  force = true
[[redirects]]
  from = "/terms"
  to = "/legal/terms"
  status = 301
  force = true
